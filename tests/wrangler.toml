name = "settlebot-d1-tests"
main = "worker.mjs"
# Wrangler 4.150.0 bundles workerd with 2026-10-13 as its newest supported date.
compatibility_date = "2026-10-13"

# Generic fake values used only by local ingress rejection tests.
[vars]
TELEGRAM_WEBHOOK_SECRET = "fake_secret"
TELEGRAM_CHAT_ID = "-100"
TELEGRAM_ADMIN_IDS = "100,101"
TELEGRAM_BOT_USERNAME = "SettleBot"
TELEGRAM_BOT_TOKEN = "500:fake_test_token"
EXPORT_SECRET = "fake_export_secret"

[[d1_databases]]
binding = "LEDGER_DB"
database_name = "settlebot-d1-tests"
database_id = "local-tests-only"
migrations_dir = "../migrations"
