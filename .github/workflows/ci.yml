name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: 1.99.0
          components: clippy, rustfmt
          targets: wasm32-unknown-unknown

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0

      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Wrangler
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --locked --all-targets

      - name: Test delivery tooling without remote calls
        run: pnpm test:delivery

      - name: Run local D1 integration tests
        run: pnpm test:d1

      - name: Verify local SQL backup and isolated restore
        run: pnpm test:recovery

      - name: Build Worker
        run: pnpm build

      - name: Package validated Worker
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: node scripts/release-artifact.mjs package "$RELEASE_SHA"

      - name: Smoke packaged Worker against isolated local D1
        run: pnpm test:release

      - name: Retain validated Worker
        id: artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: worker-${{ github.sha }}-${{ github.run_attempt }}
          path: .release/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14

  release:
    needs: validate
    # Preparation only. Remove the literal false only after authorized external setup.
    if: ${{ false && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    concurrency:
      group: settlebot-release
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      deployments: read
    uses: ./.github/workflows/release.yml
    with:
      sha: ${{ github.sha }}
      artifact_id: ${{ needs.validate.outputs.artifact_id }}
