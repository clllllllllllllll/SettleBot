name: Deploy validated Worker
description: Verify and deploy one immutable CI artifact, then perform read-only smoke checks
inputs:
  target:
    required: true
    description: staging or production
  sha:
    required: true
    description: Full validated commit SHA
  artifact_id:
    required: true
    description: Immutable artifact from this CI run
  account_id:
    required: true
    description: Cloudflare account ID
  api_token:
    required: true
    description: Environment-scoped deployment credential
  staging_d1_id:
    required: true
    description: Staging database identity
  production_d1_id:
    required: true
    description: Production database identity, checked for isolation
  worker_origin:
    required: true
    description: Exact environment workers.dev HTTPS origin
  export_secret:
    required: true
    description: Environment-specific export smoke credential
  github_token:
    required: true
    description: Read access to environment protection settings
runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      with:
        version: 11.25.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
      with:
        node-version: 24
        cache: pnpm
    - name: Install locked tooling
      shell: bash
      run: pnpm install --frozen-lockfile
    - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
      with:
        artifact-ids: ${{ inputs.artifact_id }}
        merge-multiple: true
        path: .release
    - name: Verify production approval configuration
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: node scripts/check-production-gate.mjs
    - name: Verify artifact and generate private environment configuration
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_SHA: ${{ inputs.sha }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        STAGING_D1_ID: ${{ inputs.staging_d1_id }}
        PRODUCTION_D1_ID: ${{ inputs.production_d1_id }}
      run: node scripts/prepare-deployment.mjs "$TARGET" "$RELEASE_SHA"
    - name: Deploy without rebuilding or migrating
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_SHA: ${{ inputs.sha }}
        CLOUDFLARE_API_TOKEN: ${{ inputs.api_token }}
        CLOUDFLARE_ACCOUNT_ID: ${{ inputs.account_id }}
        WRANGLER_SEND_METRICS: "false"
      run: pnpm exec wrangler deploy --config ".wrangler/$TARGET.json" --tag "$RELEASE_SHA"
    - name: Check deployed identity, authorization, and database reads
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
        RELEASE_SHA: ${{ inputs.sha }}
        WORKER_ORIGIN: ${{ inputs.worker_origin }}
        EXPORT_SECRET: ${{ inputs.export_secret }}
      run: node scripts/smoke.mjs "$TARGET" "$RELEASE_SHA"
