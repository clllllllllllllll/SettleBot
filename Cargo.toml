[package]
name = "settlebot"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
http = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8.7", features = ["d1", "http"] }
worker-macros = "0.8.7"
